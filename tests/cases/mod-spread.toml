# The mod's game: START GAME, the announcer's box clicked away, the arena's scripted bout, and
# then the whole party in view at the gate (four figures: once one, when the helper never saw a
# fight's end); then the middle button drags the view north (the mod's map scrolling), so the
# gate's top shows where the party stood.
game = "ds1o"
seconds = 126
input = "20:key=ESC 24:key=ESC 28:key=ESC 32:key=ESC 40:move=160,76 41:click=160,76 90:click=160,40 100:click=160,160 116:mdrag=160,60,160,150"
screen = [
  { at = 95, min_colours = 90 },
  { at = 114, ref = "gate", min_colours = 90, tolerance = 0.2 },
  { at = 124, ref = "dragged", min_colours = 90, tolerance = 0.2 },
]
keeps = ["CHARSAVE.GFF", "DARKRUN.GFF"]
